<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學遊戲樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3b5c;--muted:#8a7a99;--pink:#ff7eb3;--blue:#5bb4ff;--mint:#3fcf9c;--yellow:#ffc93c;--purple:#a98bff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Fredoka","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#e2f3ff 0%,#f3f9ff 40%,#fff6e5 100%);background-attachment:fixed;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-60%}.cloud::after{width:40%;height:120%;right:12%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:48px 16px}
h1{text-align:center;font-size:clamp(32px,7vw,56px);font-weight:900;margin:0;letter-spacing:2px}
h1 span{display:inline-block;animation:wig 2.4s ease-in-out infinite}
h1 span:nth-child(2n){animation-delay:.3s}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
.sub{text-align:center;color:var(--muted);font-weight:700;font-size:18px;margin:10px 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.card{display:block;text-decoration:none;color:inherit;border-radius:32px;padding:26px 24px;position:relative;overflow:hidden;transition:transform .15s}
.card:hover{transform:translateY(-6px) rotate(-.6deg)}
.card:active{transform:translateY(4px)}
.g3{background:#fff;border:5px solid var(--pink);box-shadow:0 10px 0 #d9568f}
.g5{background:linear-gradient(160deg,#1d2d75,#0b1030);color:#eaf2ff;border:5px solid #3ef0ff;box-shadow:0 10px 0 #1b4f8a}
.badge{display:inline-block;font-weight:900;font-size:16px;padding:4px 14px;border-radius:999px}
.g3 .badge{background:var(--pink);color:#fff}
.g5 .badge{background:#3ef0ff;color:#071028}
.icon{font-size:70px;line-height:1;margin:14px 0 6px}
.card h2{margin:6px 0 8px;font-size:30px;font-weight:900}
.card p{margin:0 0 14px;font-weight:700;line-height:1.6;opacity:.85}
.units{display:flex;flex-wrap:wrap;gap:6px}
.units span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.g3 .units span{background:#fff1f7}
.g5 .units span{background:rgba(255,255,255,.1)}
.go{display:inline-block;margin-top:18px;font-weight:900;font-size:20px;padding:12px 24px;border-radius:20px}
.g3 .go{background:var(--pink);color:#fff;box-shadow:0 5px 0 #d9568f}
.g5 .go{background:#3ef0ff;color:#071028;box-shadow:0 5px 0 #1b4f8a}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:40px;font-weight:700}
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<main>
  <h1><span>🎒</span> 數<span>學</span>遊<span>戲</span>樂園</h1>
  <p class="sub">你是幾年級呢？選一個開始玩吧！</p>
  <div class="grid">
    <a class="card g3" href="grade3/">
      <span class="badge">三年級</span>
      <div class="icon">🌈</div>
      <h2>三年級數學樂園</h2>
      <p>積木、糖果、蛋糕、鱷魚……用好玩的方式學數學！</p>
      <div class="units"><span>10000 以內的數</span><span>四位數加減</span><span>毫米</span><span>乘法</span><span>角</span><span>面積</span><span>除法</span><span>公升毫升</span><span>分數</span></div>
      <span class="go">開始玩 ➜</span>
    </a>
    <a class="card g5" href="grade5/">
      <span class="badge">五年級</span>
      <div class="icon">🚀</div>
      <h2>五上數學雙維度視覺實驗室</h2>
      <p>星際科學實驗室：雷射、3D 摺紙、太空電梯，看見數學的秘密！</p>
      <div class="units"><span>小數乘法</span><span>因數倍數</span><span>異分母分數</span><span>三角形與多邊形</span><span>線對稱</span><span>小數除法</span></div>
      <span class="go">進入實驗室 ➜</span>
    </a>
  </div>
  <p class="foot">康軒版課程 ‧ 學習進度只存在你自己的瀏覽器裡</p>
</main>
<script>
(function () {
  const d = document.getElementById('deco');
  [[10, 110, 80], [30, 80, 100], [62, 130, 120], [80, 90, 90]].forEach(([top, w, dur], i) => {
    const c = document.createElement('div'); c.className = 'cloud';
    c.style.cssText = `top:${top}%;width:${w}px;height:${w * 0.38}px;animation-duration:${dur}s;animation-delay:${-i * 25}s`;
    d.appendChild(c);
  });
})();
</script>
<script src="https://kuog88.github.io/home-button.js" defer></script>
</body>
</html>
