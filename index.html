<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>五上數學雙維度視覺實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a1c;--panel:rgba(16,24,58,.84);--panel2:rgba(28,40,90,.7);--line:rgba(120,160,255,.25);
  --cyan:#3ef0ff;--pink:#ff5ad9;--yellow:#ffd84a;--green:#4dff9a;--purple:#a37bff;--orange:#ff9f43;--red:#ff4d6d;
  --text:#eaf2ff;--muted:#a7b6dc;--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 15% 0%,#1d2d75 0%,transparent 55%),radial-gradient(ellipse at 95% 100%,#3c1462 0%,transparent 50%),var(--bg);
  background-attachment:fixed;color:var(--text);overflow-x:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:74px 16px 48px}
button{font-family:inherit;touch-action:manipulation}
canvas{touch-action:none;display:block}
[hidden]{display:none!important}

/* fixed buttons */
.home-btn{position:fixed;top:12px;left:12px;z-index:60;border:2px solid var(--cyan);background:rgba(8,14,40,.9);color:var(--text);
  font-size:16px;font-weight:900;padding:10px 16px;border-radius:999px;cursor:pointer;box-shadow:0 0 16px rgba(62,240,255,.45);backdrop-filter:blur(6px)}
.home-btn:active{transform:scale(.96)}
.sound-btn{position:fixed;top:12px;right:12px;z-index:60;width:46px;height:46px;border-radius:50%;border:2px solid var(--purple);
  background:rgba(8,14,40,.9);color:#fff;font-size:20px;cursor:pointer}

/* hero */
.hero{text-align:center;margin:6px 0 22px}
.hero h1{margin:0;font-size:clamp(26px,5vw,46px);font-weight:900;letter-spacing:2px;line-height:1.25}
.hero h1 span{display:block;font-size:.72em;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(62,240,255,.35))}
.hero p{color:var(--muted);margin:10px 0 0;font-size:15px}
.total{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:8px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.total b{color:var(--yellow);font-size:20px}
.reset-link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;margin-left:6px}

/* coach */
.coach{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.coach-face{flex:0 0 74px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2c3e8f,#121a45);border:3px solid var(--yellow);box-shadow:0 0 18px rgba(255,216,74,.45);overflow:hidden}
.coach-face svg{width:100%;height:100%}
.coach-bubble{position:relative;flex:1;background:linear-gradient(135deg,rgba(40,56,130,.92),rgba(30,22,80,.92));border:2px solid rgba(255,216,74,.6);border-radius:20px;padding:12px 16px;font-size:16px;line-height:1.65;min-height:60px}
.coach-bubble::before{content:"";position:absolute;left:-12px;top:22px;border:10px solid transparent;border-right-color:rgba(255,216,74,.6);border-left:0}
.coach-bubble .who{display:block;font-size:13px;color:var(--yellow);font-weight:900;margin-bottom:2px}
.coach-bubble.pulse{animation:bubblePop .35s}
@keyframes bubblePop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}

/* hub cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ucard{position:relative;text-align:left;color:var(--text);cursor:pointer;border-radius:26px;padding:20px 20px 16px;background:linear-gradient(160deg,rgba(26,36,86,.92),rgba(12,16,44,.92));
  border:2px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s;overflow:hidden}
.ucard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%)}
.ucard:hover{transform:translateY(-4px);box-shadow:0 0 24px color-mix(in srgb,var(--c) 50%,transparent)}
.ucard:active{transform:scale(.98)}
.u-no{display:inline-block;font-size:13px;font-weight:900;padding:3px 12px;border-radius:999px;background:var(--c);color:#0a0f2a}
.u-icon{position:absolute;right:18px;top:14px;font-size:40px;z-index:1}
.ucard h3{margin:10px 0 12px;font-size:23px;font-weight:900}
.u-modes{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.u-modes div{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:12px;padding:6px 10px}
.star{font-size:20px;color:rgba(255,255,255,.18);line-height:1}
.star.on{color:var(--yellow);text-shadow:0 0 10px rgba(255,216,74,.9)}
.u-stars{margin-top:10px;font-size:26px;letter-spacing:4px}

/* unit */
.unit-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.unit-head .u-no{font-size:15px}
.unit-head h2{margin:0;font-size:clamp(22px,4vw,32px);font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{position:relative;border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:18px;padding:12px 8px;font-size:15px;font-weight:900;cursor:pointer;min-height:58px;line-height:1.3}
.tab small{display:block;font-weight:500;font-size:12px;opacity:.85}
.tab.on{color:#0a0f2a;background:linear-gradient(135deg,var(--cyan),#7aa8ff);border-color:transparent;box-shadow:0 0 18px rgba(62,240,255,.55)}
.tab.on small{opacity:1}
.tab .ok{position:absolute;top:-8px;right:-6px;background:var(--yellow);color:#000;border-radius:50%;width:24px;height:24px;font-size:14px;display:grid;place-items:center;box-shadow:0 0 10px var(--yellow)}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 0 40px rgba(60,80,200,.18) inset}
.mode-title{font-size:21px;font-weight:900;margin-bottom:4px}
.mode-desc{color:var(--muted);font-size:15px;margin-bottom:12px;line-height:1.6}
.cv-wrap{width:100%;display:flex;justify-content:center;margin:8px 0;border-radius:20px;
  background:linear-gradient(rgba(62,240,255,.05) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(62,240,255,.05) 1px,transparent 1px) 0 0/24px 24px,rgba(4,8,26,.65);border:1px solid rgba(62,240,255,.15)}
.cv-wrap canvas{border-radius:20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0}
.lbl{font-weight:700;color:var(--muted)}
.btn{border:none;border-radius:18px;padding:13px 20px;min-height:52px;font-size:17px;font-weight:900;cursor:pointer;color:#071028;
  background:linear-gradient(135deg,var(--cyan),#5d9bff);box-shadow:0 4px 0 #1b4f8a,0 0 18px rgba(62,240,255,.35);transition:transform .1s,filter .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b4f8a}
.btn.pink{background:linear-gradient(135deg,var(--pink),#b06bff);box-shadow:0 4px 0 #6b1f7a,0 0 18px rgba(255,90,217,.35)}
.btn.yellow{background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:0 4px 0 #8a5a12,0 0 18px rgba(255,216,74,.35)}
.btn.green{background:linear-gradient(135deg,var(--green),#2bd4a4);box-shadow:0 4px 0 #13724f,0 0 18px rgba(77,255,154,.35)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,.4);border:1px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:15px;min-height:46px}
.btn:disabled{filter:grayscale(1) brightness(.55);cursor:not-allowed;transform:none}
.btn.glow{animation:btnGlow 1.2s infinite}
@keyframes btnGlow{50%{filter:brightness(1.25);box-shadow:0 4px 0 #1b4f8a,0 0 34px rgba(255,255,255,.65)}}
.chip{border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 16px;border-radius:999px;font-weight:900;font-size:15px;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--yellow);background:rgba(255,216,74,.18);color:var(--yellow);box-shadow:0 0 12px rgba(255,216,74,.4)}
.slider-row{display:flex;align-items:center;gap:12px;width:100%;max-width:520px}
.slider-row input{flex:1}
.tag{font-weight:900;padding:6px 12px;border-radius:12px;white-space:nowrap}
.tag.blue{background:rgba(62,140,255,.25);color:#8ec3ff}.tag.yellow{background:rgba(255,216,74,.2);color:var(--yellow)}.tag.purple{background:rgba(163,123,255,.22);color:#d2c0ff}
.val{min-width:52px;text-align:center;font-size:22px;color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;border-radius:999px;background:linear-gradient(90deg,#24306b,#3a4a9a);outline:none;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--cyan));box-shadow:0 0 14px var(--cyan);cursor:pointer;border:3px solid #0a1030}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);border:3px solid #0a1030}
.readout{text-align:center;font-size:20px;font-weight:700;line-height:1.7;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.25);min-height:52px}
.readout small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.readout .note{font-size:15px;color:var(--yellow)}
.task-bar{background:linear-gradient(90deg,rgba(255,216,74,.18),rgba(255,90,217,.12));border:1px dashed rgba(255,216,74,.6);border-radius:14px;padding:10px 14px;font-weight:700;text-align:center}
.big{font-size:1.35em}
.c-blue{color:#8ec3ff}.c-yellow{color:var(--yellow)}.c-green{color:var(--green)}.c-pink{color:var(--pink)}.c-cyan{color:var(--cyan)}.c-red{color:var(--red)}.c-purple{color:#d2c0ff}
.tip{margin-top:16px;padding:14px 18px;border-radius:20px;background:linear-gradient(135deg,rgba(255,216,74,.16),rgba(255,159,67,.1));border:2px solid rgba(255,216,74,.45);line-height:1.7;font-size:16px}
.tip b{color:var(--yellow);display:block;font-size:15px}
.guide{display:grid;gap:6px;margin:6px 0 10px}
.gstep{padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:2px solid var(--line);opacity:.55;font-size:16px;line-height:1.6;transition:.3s}
.gstep .gn{color:var(--yellow);font-weight:900;margin-right:6px}
.gstep.now{opacity:1;border-color:var(--yellow);background:rgba(255,216,74,.12);box-shadow:0 0 14px rgba(255,216,74,.25)}
.gstep.done{opacity:.85;border-color:rgba(77,255,154,.5)}
.gstep.done .gn::before{content:"✅ "}
.question{font-size:clamp(19px,3.6vw,24px);font-weight:900;text-align:center;padding:10px 12px;margin:4px 0 8px;border-radius:16px;background:rgba(62,240,255,.08);border:2px solid rgba(62,240,255,.35);line-height:1.6}
.nav-next{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:900}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor}

/* U1B frog */
.formula{text-align:center;font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:2px;margin:6px 0}
.mag-panel{display:grid;gap:8px;max-width:620px;margin:0 auto 10px}
.mag-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:19px;font-weight:700;background:rgba(255,255,255,.05);border-radius:14px;padding:8px 10px;animation:slideIn .45s both}
.mag-line .n{font-size:26px;font-weight:900}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.frog-stage{position:relative;margin:10px auto;max-width:640px;padding:70px 10px 24px;border-radius:20px;background:linear-gradient(180deg,rgba(77,255,154,.05),rgba(62,240,255,.1));border:1px solid rgba(77,255,154,.25);overflow:hidden}
.frog-track{position:relative;display:flex;justify-content:center}
.digits{display:flex;align-items:flex-end;gap:2px}
.dg{width:clamp(46px,12vw,64px);height:clamp(58px,15vw,78px);display:grid;place-items:center;font-size:clamp(34px,9vw,50px);font-weight:900;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);animation:slideIn .35s both}
.dg.zero{color:var(--pink);border-color:var(--pink);box-shadow:0 0 14px rgba(255,90,217,.6)}
.dg.zero::after{content:"補0";position:absolute;transform:translateY(46px);font-size:12px;color:var(--pink)}
.dg{position:relative}
.pt{width:22px;height:clamp(58px,15vw,78px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.pt span{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);border:2px dashed rgba(255,255,255,.5)}
.pt.final span{width:16px;height:16px;background:var(--red);border:none;box-shadow:0 0 16px var(--red)}
.frog{position:absolute;top:-62px;left:0;font-size:46px;transform:translateX(-50%);transition:left .45s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 8px rgba(77,255,154,.8));z-index:2}
.frog.hop{animation:hop .45s}
@keyframes hop{0%{transform:translateX(-50%) translateY(0)}45%{transform:translateX(-50%) translateY(-34px) scale(1.15) rotate(-12deg)}100%{transform:translateX(-50%) translateY(0)}}
.stamp{position:absolute;top:-68px;left:0;width:66px;height:66px;margin-left:-33px;border-radius:50%;border:5px double var(--red);color:var(--red);font-weight:900;font-size:14px;display:grid;place-items:center;text-align:center;line-height:1.15;opacity:0;pointer-events:none;background:rgba(255,77,109,.1);transform:rotate(-14deg) scale(2.4)}
.stamp.go{animation:stampIn .55s forwards}
@keyframes stampIn{0%{opacity:0;transform:rotate(-14deg) scale(2.4)}70%{opacity:1;transform:rotate(-14deg) scale(.92)}100%{opacity:.92;transform:rotate(-14deg) scale(1)}}
.jumps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.pip{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:900;border:2px solid currentColor;opacity:.4}
.pip.on{opacity:1;box-shadow:0 0 12px currentColor}

/* U5A fold */
.fold-scene{perspective:1700px;display:flex;justify-content:center;padding:56px 0 40px;pointer-events:none}
.fold-paper{position:relative;width:min(100%,560px);aspect-ratio:2/1.25;transform-style:preserve-3d;transform:rotateX(20deg)}
.fold-paper .rhalf{position:absolute;right:0;top:0;width:50%;height:100%;border-radius:0 18px 18px 0;background:rgba(20,30,80,.75);border:2px solid rgba(163,123,255,.35);transform:translateZ(-2px);transition:box-shadow .3s}
.flap{position:absolute;left:0;top:0;width:50%;height:100%;transform-origin:100% 50%;transform-style:preserve-3d}
.flap-face{position:absolute;inset:0;border-radius:18px 0 0 18px;background:linear-gradient(135deg,rgba(40,58,140,.95),rgba(26,36,96,.95));border:2px solid rgba(62,240,255,.55);overflow:hidden}
.fold-paper svg{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.12));opacity:0;pointer-events:none}
.axis-line{position:absolute;left:50%;top:-12px;bottom:-12px;width:6px;margin-left:-3px;border-radius:4px;background:linear-gradient(var(--purple),var(--pink));box-shadow:0 0 18px var(--pink),0 0 36px var(--purple);transform:translateZ(1px)}
.fold-paper.matched .rhalf{box-shadow:0 0 40px var(--green),0 0 80px rgba(77,255,154,.5)}
.fold-paper.matched .flap-face{border-color:var(--green);box-shadow:0 0 30px var(--green) inset}

/* long division */
.ld{position:relative;margin:0 auto;font-weight:900}
.ldc{position:absolute;z-index:2;width:40px;height:44px;display:grid;place-items:center;font-size:30px;color:#fff;animation:popIn .35s both}
.ldc.dot{color:var(--yellow);text-shadow:0 0 10px var(--yellow),0 0 3px #000;font-size:38px}
.ldc.q{color:var(--cyan)}
.ldc.hl{color:var(--pink);text-shadow:0 0 12px var(--pink)}
.ldc.new{color:var(--green);text-shadow:0 0 14px var(--green)}
.ldc.divisor{color:var(--orange)}
.ldl{position:absolute;height:3px;background:rgba(255,255,255,.75);border-radius:2px;animation:popIn .35s both}
.ldb{position:absolute;border-top:3px solid #fff;border-left:3px solid #fff;border-top-left-radius:16px}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.laser{position:absolute;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(#fff,var(--red));box-shadow:0 0 10px var(--red),0 0 24px var(--red);height:0;transition:height 1s ease-in,opacity .6s;z-index:1;opacity:.85}
.ld-box{background:rgba(0,0,0,.28);border-radius:20px;padding:14px 10px;display:flex;justify-content:center;overflow-x:auto}

/* U6A juice */
.juice-lab{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.cups-area{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px;border-radius:20px;background:rgba(0,0,0,.25)}
.jug-row{display:flex;align-items:flex-end;gap:18px}
.cups{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.vessel{position:relative;border:3px solid rgba(255,255,255,.7);border-top:none;overflow:hidden;background:rgba(255,255,255,.05)}
.vessel .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffcb5a,#ff8a00);transition:height 1.4s ease;box-shadow:0 0 14px rgba(255,159,67,.7) inset}
.jug{width:86px;height:140px;border-radius:0 0 18px 18px}
.cup{width:54px;height:86px;border-radius:0 0 14px 14px}
.vlabel{text-align:center;font-size:14px;font-weight:900;margin-top:4px}
.left-bubble{font-size:15px;font-weight:900;padding:8px 12px;border-radius:14px;background:rgba(255,77,109,.15);border:2px dashed var(--red);color:#ffb3c1;text-align:center}
.left-bubble.ok{background:rgba(77,255,154,.12);border-color:var(--green);color:var(--green)}

/* U6B coins */
.coin-lab{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.pool-wrap{background:rgba(0,0,0,.25);border-radius:20px;padding:10px 12px;margin-bottom:12px}
.pool-label{font-weight:900;color:var(--yellow);margin-bottom:6px}
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;align-items:center;justify-content:center}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.person{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center}
.ava{font-size:30px}
.pname{font-size:13px;color:var(--muted)}
.wallet{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:56px;align-content:flex-start;padding:4px}
.amt{font-weight:900;color:var(--green);font-size:16px}
.coin{display:grid;place-items:center;border-radius:50%;font-weight:900;color:#3a2600;flex:0 0 auto}
.coin.c1{width:46px;height:46px;font-size:13px;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffcc33 45%,#c98a00);box-shadow:0 0 10px rgba(255,204,51,.7)}
.coin.c01{width:30px;height:30px;font-size:10px;color:#1d2433;background:radial-gradient(circle at 35% 30%,#ffffff,#c9d4e6 50%,#7b8aa6);box-shadow:0 0 8px rgba(200,220,255,.6)}
.coin.c001{width:22px;height:22px;font-size:8px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffd0a8,#d9782d 55%,#8b4513);box-shadow:0 0 6px rgba(217,120,45,.7)}
.person .coin.c1{width:34px;height:34px;font-size:10px}
.person .coin.c01{width:22px;height:22px;font-size:8px}
.person .coin.c001{width:16px;height:16px;font-size:6px}
.coin.boom{animation:boom .45s forwards}
@keyframes boom{to{transform:scale(2.4);opacity:0;filter:brightness(3)}}
.coin.spawn{animation:spawn .55s both}
@keyframes spawn{from{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}to{transform:none;opacity:1}}

/* scaffold */
.problem{text-align:center;font-size:clamp(24px,5vw,36px);font-weight:900;margin:6px 0 12px}
.visual{display:flex;justify-content:center;margin-bottom:12px}
.steps{display:grid;gap:14px}
.step{border-radius:20px;padding:14px 16px;background:var(--panel2);border:2px solid var(--line);animation:slideIn .4s both}
.step.solved{border-color:rgba(77,255,154,.6);background:rgba(20,70,60,.35)}
.step-no{display:inline-block;font-size:13px;font-weight:900;padding:3px 12px;border-radius:999px;background:var(--purple);color:#fff;margin-bottom:6px}
.step.solved .step-no{background:var(--green);color:#062}
.step-q{font-size:18px;font-weight:700;line-height:1.7}
.blank{display:inline-block;min-width:54px;padding:0 8px;margin:0 3px;border-bottom:3px solid var(--yellow);color:var(--yellow);text-align:center;font-weight:900}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.opt{min-width:84px;min-height:52px;padding:10px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.opt.sel{border-color:var(--yellow);background:rgba(255,216,74,.2);color:var(--yellow)}
.opt.right{border-color:var(--green);background:rgba(77,255,154,.22);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(255,77,109,.2);animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ok-msg{margin-top:8px;color:var(--green);font-weight:700;font-size:16px}
.final-card{text-align:center;padding:18px;border-radius:20px;background:linear-gradient(135deg,rgba(255,216,74,.2),rgba(77,255,154,.15));border:2px solid var(--yellow);font-size:19px;font-weight:900;animation:slideIn .4s both}
.factor-lists{display:grid;gap:8px;font-size:17px;font-weight:700}
.factor-lists span{display:inline-block;min-width:34px;padding:4px 8px;margin:2px;border-radius:10px;background:rgba(255,255,255,.08);text-align:center}

/* toast & confetti */
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);z-index:80;padding:14px 26px;border-radius:999px;font-size:20px;font-weight:900;color:#1a1200;
  background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:0 0 30px rgba(255,216,74,.8);opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:79;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r));opacity:.9}}

@media (max-width:720px){
  #app{padding:70px 12px 40px}
  .stage{padding:14px 10px;border-radius:20px}
  .tab{font-size:13px;padding:10px 4px}
  .tab small{font-size:11px}
  .coach-face{flex-basis:56px;width:56px;height:56px}
  .coach-bubble{font-size:15px;padding:10px 12px}
  .juice-lab,.coin-lab{grid-template-columns:1fr}
  .btn{font-size:16px;padding:12px 16px}
  .readout{font-size:17px}
  .home-btn{font-size:14px;padding:9px 13px}
  .grid{grid-template-columns:1fr}
}

<body>
<canvas id="stars"></canvas>
<button class="home-btn" id="homeBtn">🏠 返回首頁選單</button>
<button class="sound-btn" id="soundBtn" title="音效開關">🔊</button>
<div class="toast" id="toast"></div>

<div id="app">
  <!-- ========== 首頁大廳 ========== -->
  <section id="hub">
    <header class="hero">
      <h1>🚀 五上數學<span>雙維度視覺實驗室</span></h1>
      <p>康軒五上 6 大單元 × 每單元 3 關｜空間感知 ✦ 邏輯拆解 ✦ 鷹架挑戰</p>
      <div class="total">⭐ 已收集 <b id="totalStars">0</b> / <span id="totalMax">19</span> 顆星 <button class="reset-link" id="resetBtn">重置進度</button></div>
    </header>
    <div class="coach">
      <div class="coach-face" data-face></div>

    </div>

  </section>
</div>

<script>
/* =========================================================
   共用工具
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const fmt = n => String(parseFloat(n.toFixed(6)));
const f1 = n => (n / 10).toFixed(1);
const F = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const FONT = '"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
const TAU = Math.PI * 2;

let cleanups = [];
function onCleanup(fn) { cleanups.push(fn); }
function runCleanup() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function later(fn, ms) { const id = setTimeout(fn, ms); onCleanup(() => clearTimeout(id)); return id; }
function loop(fn) {
  let id, last = performance.now();
  const f = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; fn(dt, now / 1000); id = requestAnimationFrame(f); };
  id = requestAnimationFrame(f);
  onCleanup(() => cancelAnimationFrame(id));
}
/* 以「邏輯座標 W×H」設計畫面，自動等比縮放到容器寬度 */
function setupCanvas(cv, W, H, maxW) {
  const ctx = cv.getContext('2d');
  const C = { W, H, ctx, s: 1, dw: 0 };
  function resize() {
    const pw = cv.parentElement.clientWidth;
    if (!pw) return;
    const dw = Math.min(pw, maxW || W);
    if (dw === C.dw) return;
    C.dw = dw;
    const s = dw / W, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = dw + 'px'; cv.style.height = (H * s) + 'px';
    cv.width = Math.round(dw * dpr); cv.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
    C.s = s;
  }
  resize();
  const ro = new ResizeObserver(resize); ro.observe(cv.parentElement);
  onCleanup(() => ro.disconnect());
  C.pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  C.clear = () => { ctx.clearRect(0, 0, W, H); };
  return C;
}
function txt(ctx, t, x, y, o = {}) {
  const { size = 20, color = '#fff', align = 'center', weight = 900, glow = null, stroke = null } = o;
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 14; }
  ctx.fillStyle = color; ctx.fillText(t, x, y); ctx.shadowBlur = 0;
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fracC(ctx, n, d, x, y, size, color, glow) {
  txt(ctx, String(n), x, y - size * 0.62, { size, color, glow });
  ctx.fillStyle = color; ctx.fillRect(x - size * 0.6, y - 2, size * 1.2, 4);
  txt(ctx, String(d), x, y + size * 0.62, { size, color, glow });
}
function glowLine(ctx, x1, y1, x2, y2, color, w = 4) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = w * 0.35; ctx.shadowBlur = 0; ctx.stroke(); ctx.restore();
}
function star(ctx, x, y, r, color) {
  ctx.save(); ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.fill(); ctx.restore();
}

/* 音效 */
let AC = null, soundOn = true;
function sfx(type) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const map = { ok: [660, 990, 'triangle'], bad: [240, 150, 'sawtooth'], click: [520, 640, 'sine'], win: [523, 1318, 'triangle'], zap: [1200, 180, 'square'], hop: [380, 760, 'sine'] };
    const [a, b, w] = map[type] || map.click;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = w; o.frequency.setValueAtTime(a, t); o.frequency.exponentialRampToValueAtTime(b, t + 0.22);
    g.gain.setValueAtTime(type === 'zap' ? 0.05 : 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.32);
  } catch (e) {}
}

/* 石虎博士頭像 SVG */
const LEO_SVG = `<svg viewBox="0 0 100 100"><defs><radialGradient id="lf" cx="50%" cy="45%"><stop offset="0" stop-color="#e9b877"/><stop offset="1" stop-color="#b57b3e"/></radialGradient></defs>
<path d="M18 40 L22 10 L42 28 Z" fill="#b57b3e"/><path d="M82 40 L78 10 L58 28 Z" fill="#b57b3e"/>
<path d="M24 34 L25 18 L36 29 Z" fill="#3b2a1a"/><path d="M76 34 L75 18 L64 29 Z" fill="#3b2a1a"/>
<ellipse cx="50" cy="56" rx="36" ry="32" fill="url(#lf)"/>
<path d="M40 26 Q42 36 41 44 M50 24 L50 42 M60 26 Q58 36 59 44" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="28" cy="50" r="3" fill="#5a3a1c"/><circle cx="72" cy="50" r="3" fill="#5a3a1c"/><circle cx="24" cy="62" r="2.5" fill="#5a3a1c"/><circle cx="76" cy="62" r="2.5" fill="#5a3a1c"/>
<rect x="24" y="44" width="22" height="16" rx="8" fill="#0d2a4a" stroke="#3ef0ff" stroke-width="3"/><rect x="54" y="44" width="22" height="16" rx="8" fill="#0d2a4a" stroke="#3ef0ff" stroke-width="3"/>
<line x1="46" y1="51" x2="54" y2="51" stroke="#3ef0ff" stroke-width="3"/>
<circle cx="35" cy="52" r="4" fill="#ffe680"/><circle cx="65" cy="52" r="4" fill="#ffe680"/>
<ellipse cx="50" cy="72" rx="14" ry="10" fill="#fff3e0"/><path d="M45 67 L55 67 L50 72 Z" fill="#d9646e"/>
<path d="M50 72 Q46 78 42 76 M50 72 Q54 78 58 76" stroke="#5a3a1c" stroke-width="2" fill="none"/>
<path d="M30 70 L14 66 M30 74 L14 76 M70 70 L86 66 M70 74 L86 76" stroke="#fff" stroke-width="1.5"/></svg>`;
$$('[data-face]').forEach(e => e.innerHTML = LEO_SVG);

function coach(html) {
  const b = $('#coachText');
  b.innerHTML = `<span class="who">石虎博士 Dr. Leo</span>${html}`;
  b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function confetti() {
  const colors = ['#3ef0ff', '#ff5ad9', '#ffd84a', '#4dff9a', '#a37bff', '#ff9f43'];
  for (let i = 0; i < 46; i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = colors[i % colors.length];
    d.style.setProperty('--x', (Math.random() * 200 - 100) + 'px'); d.style.setProperty('--r', (Math.random() * 900) + 'deg');
    d.style.animationDuration = (1.6 + Math.random() * 1.4) + 's'; d.style.animationDelay = (Math.random() * 0.3) + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 3400);
  }
}

/* =========================================================
   進度儲存
   ========================================================= */
const KEY = 'mathlab5A_progress_v1';
let P = {};
function loadP() { try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { P = {}; } for (let i = 1; i <= 6; i++) P[i] = Object.assign({ A: false, B: false, C: false, S: false }, P[i] || {}); }
function saveP() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
loadP();

let cur = { uid: 1, mode: 'A' };
function complete(uid, m, msg) {
  const first = !P[uid][m];
  P[uid][m] = true; saveP(); renderTabs(); renderNext();
  sfx('win');
  if (first) { confetti(); toast(`⭐ 獲得星星！${UNITS[uid - 1].title}・${modeName(UNITS[uid - 1], m)}`); }
  if (msg) coach(msg);
}

/* =========================================================
   單元資料
   ========================================================= */
const MODE_NAMES = { A: '玩法 A', B: '玩法 B', C: '終極挑戰', S: '三邊關係' };
const TAB_INFO = {
  A: ['🎮 玩法 A', '空間與物理感知'],
  B: ['🧩 玩法 B', '規則與邏輯拆解'],
  C: ['🎯 終極挑戰', '步驟鷹架填空']
};
const UNITS = [
  { id: 1, icon: '✖️', color: '#3ef0ff', title: '小數的乘法', A: '光影百格面積陣', B: '小數點跳跳蛙', C: '小數位數鷹架' },
  { id: 2, icon: '🪖', color: '#4dff9a', title: '因數與倍數', A: '閱兵方陣排排站', B: '雙軌太空電梯', C: '公因數大搜查' },
  { id: 3, icon: '🍕', color: '#ffd84a', title: '異分母分數的加減', A: '3D 披薩雷射切片廠', B: '分數積木軌道尺', C: '通分三步驟' },
  { id: 4, icon: '🔺', color: '#ff9f43', title: '三角形與多邊形內角和', S: '三根木棒圍圍看', B: '撕角拼圖（三角形內角和）', A: '頂點雷射切割機（多邊形）', C: '內角和公式',
    modes: ['S', 'B', 'A', 'C'],
    tabs: { S: ['📏 第 1 關', '三角形三邊關係'], B: ['🔺 第 2 關', '三角形內角和'], A: ['🔷 第 3 關', '多邊形內角和'], C: ['🎯 終極挑戰', '步驟鷹架填空'] },
    names: { S: '第 1 關', B: '第 2 關', A: '第 3 關', C: '終極挑戰' } },
  { id: 5, icon: '🦋', color: '#a37bff', title: '線對稱圖形', A: '3D 空間摺紙鏡', B: '方格步數探測器', C: '對稱點偵探' },
  { id: 6, icon: '🥤', color: '#ff5ad9', title: '整數與小數除以整數', A: '果汁分裝與餘數雷射', B: '退位換幣拆解機', C: '小數點對齊術' }
];
UNITS.forEach(u => { u.modes = u.modes || ['A', 'B', 'C']; });
const tabInfo = (u, m) => (u.tabs && u.tabs[m]) || TAB_INFO[m];
const modeName = (u, m) => (u.names && u.names[m]) || MODE_NAMES[m];
const TOTAL_STARS = UNITS.reduce((a, u) => a + u.modes.length, 0);
const TIPS = {
  '1A': '小數乘小數，就像在一塊巧克力上「切一部分的一部分」：拿 0.4 塊巧克力的 0.3，當然越切越小，只剩 0.12 塊！所以兩個比 1 小的數相乘，答案會變小喔。',

  '1C': '三句話秒殺：①先數被乘數的小數位 ②再數乘數的小數位 ③加起來，就是小數點從右往左跳的格數！',
  '2A': '閱兵隊伍不能有人落單！能排得「剛剛好、整整齊齊」的排數就是因數。12 人能排 1、2、3、4、6、12 排，排 5 排就會有人哭哭落單。',
  '2B': '兩部電梯各走各的步伐：A 兩樓兩樓跳、B 三樓三樓跳。牠們在同一層樓「撞見」的樓層都是公倍數，第一次撞見的就是最小公倍數！',

  '3B': '要量兩塊積木，就要用同一把尺，而且兩塊都要量出「剛好整格」！格線對不齊就量不準！找到一把讓兩塊積木都「剛好對齊」的尺，那把尺的格子就是公分母。',
  '3C': '異分母加減三招：①找最小公倍數當新分母 ②分子跟著分母一起放大（擴分）③分母一樣後，分子直接加減！',

/* =========================================================
   首頁與分頁
   ========================================================= */
function renderHub() {
  let total = 0;
  $('#cards').innerHTML = UNITS.map(u => {
    const p = P[u.id]; u.modes.forEach(m => total += p[m] ? 1 : 0);
    const s = m => `<span class="star ${p[m] ? 'on' : ''}">★</span>`;
    const ic = { A: '🎮 A', B: '🧩 B', C: '🎯 挑戰' };
    return `<button class="ucard" style="--c:${u.color}" data-u="${u.id}">
      <span class="u-no">單元 ${u.id}</span><div class="u-icon">${u.icon}</div>
      <h3>${u.title}</h3>
      <div class="u-modes">
        ${u.modes.map(m => `<div>${s(m)} ${u.tabs ? tabInfo(u, m)[0] : ic[m]}｜${u[m]}</div>`).join('')}
      </div>
      <div class="u-stars">${u.modes.map(s).join('')}</div>
    </button>`;
  }).join('');
  $('#totalStars').textContent = total; $('#totalMax').textContent = TOTAL_STARS;
  $$('.ucard').forEach(b => b.onclick = () => { sfx('click'); openUnit(+b.dataset.u); });
}
function goHome() {
  runCleanup();
  $('#unit').hidden = true; $('#hub').hidden = false;
  renderHub(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function openUnit(uid, mode) {
  cur.uid = uid;
  const u = UNITS[uid - 1];

  $('#unitNo').textContent = `單元 ${uid} ${u.icon}`; $('#unitNo').style.setProperty('--c', u.color); $('#unitNo').style.background = u.color;
  $('#unitTitle').textContent = u.title;
  window.scrollTo({ top: 0 });
  openMode(mode);
}
function renderTabs() {
  const u = UNITS[cur.uid - 1];
  $('#tabs').style.gridTemplateColumns = `repeat(${u.modes.length},1fr)`;
  $('#tabs').innerHTML = u.modes.map(m => `<button class="tab ${cur.mode === m ? 'on' : ''}" data-m="${m}">
    ${P[cur.uid][m] ? '<span class="ok">★</span>' : ''}${tabInfo(u, m)[0]}<small>${tabInfo(u, m)[1]}<br>${u[m]}</small></button>`).join('');
  $$('.tab').forEach(b => b.onclick = () => { if (b.dataset.m !== cur.mode) { sfx('click'); openMode(b.dataset.m); } });
}
function renderNext() {
  const u = UNITS[cur.uid - 1], order = u.modes, i = order.indexOf(cur.mode), last = order.length - 1;
  const nav = $('#navNext');
  const done = P[cur.uid][cur.mode];
  if (i < last) nav.innerHTML = `<button class="btn ${done ? 'yellow glow' : 'ghost'}" id="nextBtn">下一關：${tabInfo(u, order[i + 1])[0]} ➜</button>`;
  else if (cur.uid < 6) nav.innerHTML = `<button class="btn ghost" id="homeBtn2">🏠 回大廳</button><button class="btn ${done ? 'yellow glow' : 'ghost'}" id="nextBtn">前往單元 ${cur.uid + 1} ➜</button>`;
  else nav.innerHTML = `<button class="btn ${done ? 'yellow glow' : 'ghost'}" id="homeBtn2">🏠 回大廳看星星</button>`;
  const nb = $('#nextBtn'); if (nb) nb.onclick = () => { sfx('click'); i < last ? openMode(order[i + 1]) : openUnit(cur.uid + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const hb = $('#homeBtn2'); if (hb) hb.onclick = goHome;
}
function guideHTML(steps) { return `<div class="guide">${steps.map((t, i) => `<div class="gstep" data-g="${i}"><span class="gn">第 ${i + 1} 步</span>${t}</div>`).join('')}</div>`; }
function setGuide(st, i) { $$('.gstep', st).forEach((g, k) => { g.classList.toggle('done', k < i); g.classList.toggle('now', k === i); }); }
function modeHead(title, desc) { return `<div class="mode-title">${title}</div><div class="mode-desc">${desc}</div>`; }
function openMode(m) {

/* =========================================================
   單元 1A：光影百格面積陣
   ========================================================= */
function m1A(st) {
  st.innerHTML = modeHead('🎮 玩法 A：光影百格面積陣', '整張 10×10 方格代表 1 × 1 = 1。藍光照亮「長」、黃光照亮「寬」，兩道光交會變成綠光，綠光格數 ÷ 100 就是答案！') +
    `<div class="task-bar" id="task"></div>
    <div class="cv-wrap"><canvas id="cv"></canvas></div>
    <div class="controls">
      <div class="slider-row"><span class="tag blue">🔵 長</span><input type="range" id="sa" min="1" max="10" value="10"><b class="val" id="va">1.0</b></div>
      <div class="slider-row"><span class="tag yellow">🟡 寬</span><input type="range" id="sb" min="1" max="10" value="10"><b class="val" id="vb">1.0</b></div>
    </div>
    <div class="readout" id="ro"></div>`;
  const C = setupCanvas($('#cv', st), 520, 520, 470), ctx = C.ctx;
  const sa = $('#sa', st), sb = $('#sb', st);
  const tasks = [[4, 3], [6, 7]];
  let a = 10, b = 10, ti = 0, flash = 0;
  function renderTask() {
    $('#task', st).innerHTML = ti < tasks.length
      ? `🎯 任務 ${ti + 1}/${tasks.length}：調出 <b class="c-blue">${f1(tasks[ti][0])}</b> × <b class="c-yellow">${f1(tasks[ti][1])}</b>，數數綠光有幾格？`
      : `✅ 任務全部完成！你可以自由拉動，觀察「越乘越小」的秘密。`;
  }
  function upd() {
    a = +sa.value; b = +sb.value;
    $('#va', st).textContent = f1(a); $('#vb', st).textContent = f1(b);
    const g = a * b;
    $('#ro', st).innerHTML = `<span class="c-blue">${f1(a)}</span> × <span class="c-yellow">${f1(b)}</span> = <b class="c-green big">${fmt(g / 100)}</b>
      <small>綠光 ${g} 格 ÷ 全部 100 格 = ${fmt(g / 100)}</small>` +
      (a < 10 && b < 10 ? `<div class="note">✨ 兩個數都比 1 小，答案 ${fmt(g / 100)} 比 ${f1(Math.min(a, b))} 和 ${f1(Math.max(a, b))} 都還小！</div>` : '');
    if (ti < tasks.length && a === tasks[ti][0] && b === tasks[ti][1]) {
      ti++; flash = 1;
      if (ti < tasks.length) { sfx('ok'); coach(`太棒了！${f1(a)} × ${f1(b)} = <b class="c-green">${fmt(g / 100)}</b>，綠光剛好 ${g} 格！再挑戰下一個任務。`); }
      else complete(1, 'A', `全部完成！你發現了嗎？<b>0.6 × 0.7 = 0.42</b>，綠色面積只佔一部分，所以小數乘小數，答案會「變小」！`);
    }
    renderTask();
  }
  sa.oninput = upd; sb.oninput = upd; upd();
  const ox = 70, oy = 70, cs = 42;
  loop((dt, t) => {
    C.clear(); flash = Math.max(0, flash - dt);
    // 光束
    ctx.save(); ctx.shadowBlur = 20;
    ctx.shadowColor = '#3e8cff'; ctx.fillStyle = '#3e8cff'; rrect(ctx, ox, oy - 26, a * cs, 12, 6); ctx.fill();
    ctx.shadowColor = '#ffd84a'; ctx.fillStyle = '#ffd84a'; rrect(ctx, ox - 26, oy, 12, b * cs, 6); ctx.fill();
    ctx.restore();
    txt(ctx, `長 ${f1(a)}`, ox + a * cs / 2, oy - 48, { size: 20, color: '#8ec3ff' });
    ctx.save(); ctx.translate(ox - 50, oy + b * cs / 2); ctx.rotate(-Math.PI / 2); txt(ctx, `寬 ${f1(b)}`, 0, 0, { size: 20, color: '#ffd84a' }); ctx.restore();
    for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
      const x = ox + c * cs, y = oy + r * cs, inA = c < a, inB = r < b;
      rrect(ctx, x + 2, y + 2, cs - 4, cs - 4, 7);
      if (inA && inB) {
        const p = 0.75 + 0.2 * Math.sin(t * 3 + (r + c) * 0.5);
        ctx.save(); ctx.shadowColor = '#4dff9a'; ctx.shadowBlur = 12 + flash * 20;
        ctx.fillStyle = `rgba(77,255,154,${p})`; ctx.fill(); ctx.restore();
      } else if (inA) { ctx.fillStyle = 'rgba(62,140,255,.38)'; ctx.fill(); }
      else if (inB) { ctx.fillStyle = 'rgba(255,216,74,.34)'; ctx.fill(); }
      else { ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fill(); }
      ctx.strokeStyle = 'rgba(140,180,255,.22)'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, cs * 10, cs * 10);
    txt(ctx, '1', ox + cs * 10 + 14, oy + cs * 10 + 14, { size: 16, color: '#a7b6dc' });
    txt(ctx, `${a * b} 格`, ox + a * cs / 2, oy + b * cs / 2, { size: a * b < 6 ? 18 : 30, color: '#fff', stroke: '#063' });
    txt(ctx, '整張 = 1 × 1 = 100 格', 260, 505, { size: 16, color: '#a7b6dc', weight: 700 });
  });
}

/* =========================================================
   單元 1B：小數點跳跳蛙
   ========================================================= */
function m1B(st) {
  const probs = [['1.2', '0.04'], ['0.15', '0.3'], ['0.6', '0.07'], ['2.3', '0.3']];
  let pi = 0, s;
  st.innerHTML = modeHead('🧩 玩法 B：小數點跳跳蛙', '先用放大鏡把小數變整數相乘，再控制青蛙把小數點從最右邊往左「跳」回正確位置！') +
    `<div class="formula" id="fm"></div>
    <div class="controls">
      <button class="btn" id="bMag">🔍 第一步：放大鏡變整數</button>
      <button class="btn pink" id="bJump" disabled>🐸 第二步：青蛙往左跳</button>
      <button class="btn ghost sm" id="bNew">🔄 換一題</button>
    </div>
    <div class="mag-panel" id="mag"></div>
    <div class="frog-stage"><div class="frog-track" id="track"><div class="digits" id="dg"></div><div class="frog" id="frog" hidden>🐸</div><div class="stamp" id="stamp">小數點<br>印章</div></div></div>
    <div class="jumps" id="jumps"></div>
    <div class="readout" id="ro">點擊「🔍 放大鏡」開始！</div>`;
  const dec = x => (x.split('.')[1] || '').length;
  const bMag = $('#bMag', st), bJump = $('#bJump', st);
  function setup() {
    const [A, B] = probs[pi];
    const dA = dec(A), dB = dec(B), iA = parseInt(A.replace('.', ''), 10), iB = parseInt(B.replace('.', ''), 10);
    s = { A, B, dA, dB, iA, iB, total: dA + dB, digits: [], p: 0, jumped: 0, zeros: 0, done: false };
    $('#fm', st).innerHTML = `<span class="c-cyan">${A}</span> × <span class="c-pink">${B}</span> = <span class="c-yellow">?</span>`;
    $('#mag', st).innerHTML = ''; $('#dg', st).innerHTML = ''; $('#jumps', st).innerHTML = '';
    $('#frog', st).hidden = true; $('#stamp', st).classList.remove('go');
    $('#ro', st).innerHTML = '點擊「🔍 放大鏡」開始！';
    bMag.disabled = false; bJump.disabled = true; bJump.textContent = '🐸 第二步：青蛙往左跳';
  }
  function placeFrog() {
    const pt = $('.pt', st), track = $('#track', st), frog = $('#frog', st);
    if (!pt) return;
    const r1 = pt.getBoundingClientRect(), r0 = track.getBoundingClientRect();
    const x = r1.left - r0.left + r1.width / 2;
    frog.style.left = x + 'px'; $('#stamp', st).style.left = x + 'px';
  }
  function renderDigits(final) {
    const dg = $('#dg', st); dg.innerHTML = '';
    const pt = () => { const e = document.createElement('div'); e.className = 'pt' + (final ? ' final' : ''); e.innerHTML = '<span></span>'; return e; };
    s.digits.forEach((d, i) => {
      if (i === s.p) dg.appendChild(pt());
      const e = document.createElement('div'); e.className = 'dg' + (i < s.zeros ? ' zero' : ''); e.textContent = d; dg.appendChild(e);
    });
    if (s.p === s.digits.length) dg.appendChild(pt());
    requestAnimationFrame(placeFrog);
  }
  function renderPips() {
    let h = '';
    for (let i = 0; i < s.total; i++) {
      const fromA = i < s.dA;
      h += `<span class="pip ${i < s.jumped ? 'on' : ''}" style="color:${fromA ? 'var(--cyan)' : 'var(--pink)'}">第 ${i + 1} 跳（${fromA ? '被乘數' : '乘數'}）</span>`;
    }
    $('#jumps', st).innerHTML = h;
  }
  bMag.onclick = () => {
    sfx('ok'); bMag.disabled = true;
    const prod = s.iA * s.iB;
    $('#mag', st).innerHTML =
      `<div class="mag-line"><span class="n c-cyan">${s.A}</span> 🔍➜ <span class="n c-cyan">${s.iA}</span><span>（小數 <b class="c-cyan">${s.dA}</b> 位 → 青蛙要跳 ${s.dA} 格）</span></div>
       <div class="mag-line" style="animation-delay:.25s"><span class="n c-pink">${s.B}</span> 🔍➜ <span class="n c-pink">${s.iB}</span><span>（小數 <b class="c-pink">${s.dB}</b> 位 → 青蛙要跳 ${s.dB} 格）</span></div>
       <div class="mag-line" style="animation-delay:.5s">先當整數算：<span class="n">${s.iA} × ${s.iB} = <span class="c-yellow">${prod}</span></span></div>`;
    s.digits = String(prod).split(''); s.p = s.digits.length;
    $('#frog', st).hidden = false; renderDigits(false); renderPips();
    bJump.disabled = false; bJump.classList.add('glow');
    $('#ro', st).innerHTML = `青蛙 🐸 現在站在 ${prod} 的最右邊，總共要往左跳 <b class="c-yellow">${s.dA} + ${s.dB} = ${s.total}</b> 格！`;
    coach(`放大鏡把小數點都請走了！${s.iA} × ${s.iB} = ${prod}。現在按「青蛙往左跳」，跳 <b>${s.dA} + ${s.dB} = ${s.total}</b> 格把小數點背回來。`);
  };
  bJump.onclick = () => {
    if (s.done || s.jumped >= s.total) return;
    let padded = false;
    if (s.p === 0) { s.digits.unshift('0'); s.zeros++; padded = true; } else s.p--;
    s.jumped++; sfx('hop');
    const frog = $('#frog', st); frog.classList.remove('hop'); void frog.offsetWidth; frog.classList.add('hop');
    renderDigits(false); renderPips();
    bJump.textContent = `🐸 往左跳（還剩 ${s.total - s.jumped} 跳）`;
    $('#ro', st).innerHTML = padded ? `沒有格子可以跳了！青蛙踩了一個 <b class="c-pink">0</b> 當墊腳石 🪨` : `跳了第 ${s.jumped} 格！`;
    if (s.jumped >= s.total) {
      s.done = true; bJump.disabled = true; bJump.classList.remove('glow');
      later(() => {
        if (s.p === 0) { s.digits.unshift('0'); s.zeros++; s.p = 1; }
        renderDigits(true);
        $('#frog', st).hidden = true;
        later(() => { $('#stamp', st).classList.remove('go'); void $('#stamp', st).offsetWidth; $('#stamp', st).classList.add('go'); sfx('ok'); }, 120);
        const res = s.digits.slice(0, s.p).join('') + '.' + s.digits.slice(s.p).join('');
        $('#fm', st).innerHTML = `<span class="c-cyan">${s.A}</span> × <span class="c-pink">${s.B}</span> = <span class="c-green">${res}</span>`;
        $('#ro', st).innerHTML = `蓋上小數點印章！<b class="c-green big">${s.A} × ${s.B} = ${res}</b>${s.zeros ? `<small>前面不夠位數就「補 0」，個位沒有數字也要補 0</small>` : ''}`;
        complete(1, 'B', `成功！小數位數 ${s.dA} + ${s.dB} = ${s.total}，青蛙往左跳 ${s.total} 格，答案是 <b class="c-green">${res}</b>。按「換一題」再玩一次吧！`);
      }, 520);
    }
  };
  $('#bNew', st).onclick = () => { pi = (pi + 1) % probs.length; sfx('click'); setup(); coach(INTRO['1B']); };
  const onR = () => placeFrog(); window.addEventListener('resize', onR); onCleanup(() => window.removeEventListener('resize', onR));
  setup();
}

/* =========================================================
   鷹架填空引擎（各單元終極挑戰共用）
   ========================================================= */
function scaffold(st, uid, cfg) {
  st.innerHTML = modeHead('🎯 終極挑戰：步驟鷹架填空', '不用算很久！跟著 Step 1 ➜ Step 4，點選正確的觀念就能過關。答錯沒關係，石虎博士會給提示。') +
    `<div class="problem">${cfg.problem}</div>${cfg.visual ? `<div class="visual">${cfg.visual}</div>` : ''}<div class="steps" id="steps"></div>`;
  if (cfg.after) cfg.after(st);
  const box = $('#steps', st);
  let idx = 0;
  function showStep() {
    if (idx >= cfg.steps.length) {
      const f = document.createElement('div'); f.className = 'final-card'; f.innerHTML = `🏆 挑戰成功！<br>${cfg.final}`;
      box.appendChild(f); f.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      complete(uid, 'C', `你把每一步都想清楚了！${cfg.final}`); return;
    }
    const sp = cfg.steps[idx], card = document.createElement('div');
    card.className = 'step';
    const multi = !!sp.multi;
    card.innerHTML = `<span class="step-no">Step ${idx + 1}</span><div class="step-q">${sp.q}</div>
      <div class="opts">${sp.opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
      ${multi ? `<div class="controls" style="justify-content:flex-start"><button class="btn sm green" data-check>✔ 確認選好了</button></div>` : ''}
      <div class="ok-msg" hidden></div>`;
    box.appendChild(card);
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    const solve = () => {
      card.classList.add('solved'); sfx('ok');

  }
  function box() {

    ctx.fillStyle = '#2b1c55'; ctx.beginPath(); ctx.moveTo(cx - 160, cy + 72); ctx.lineTo(cx + 160, cy + 72); ctx.lineTo(cx + 160, cy + 98); ctx.lineTo(cx - 160, cy + 98); ctx.closePath(); ctx.fill();

    if (!cut) txt(ctx, '⬅ 一樣大嗎？➡', 300, 212, { size: 18, color: '#ffd84a', glow: '#ffd84a' });

      coach(`用 1/${n} 尺量，有積木是「${Math.floor((isAl(1 / 2, n) ? 1 / 3 : 1 / 2) * n)} 格多一點」，量不準！再換一把尺試試。`);

        ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 222); ctx.lineTo(x, 278); ctx.stroke();

        ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.setLineDash([7, 6]); ctx.shadowColor = col; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(X(f), 126); ctx.lineTo(X(f), 230); ctx.stroke(); ctx.restore();

function m4S(st) {

      <div class="slider-row"><span class="tag yellow">木棒③</span><input type="range" min="1" max="10" value="5" data-k="2"><b class="val" data-v="2">5</b></div>
    </div>
    <div class="controls"><button class="btn glow" id="bGo">🔨 倒下來圍圍看！</button></div>
    <div class="readout" id="ro">先選三根木棒的長度（公分），再按「倒下來圍圍看」！</div>`;

  const COLS = ['#3ef0ff', '#ff5ad9', '#ffd84a'], U = 34, BY = 304;
  let L = [3, 4, 5], e = 0, going = false, res = null;
  const seen = { ok: false, eq: false, lt: false };
  function sticks() {
    const arr = L.map((v, i) => ({ v, col: COLS[i], n: '①②③'[i] }));
    arr.sort((a, b) => a.v - b.v);
    return { a: arr[0], b: arr[1], c: arr[2] };   // c = 最長（放在底邊）
  }
  function task() {
    const it = (ok, t) => `<span style="opacity:${ok ? 1 : .6}">${ok ? '✅' : '⬜'} ${t}</span>`;
    $('#task', st).innerHTML = `🎯 任務：三種情況都試一次<br>${it(seen.ok, '圍成功')}　${it(seen.lt, '短+短「比較短」')}　${it(seen.eq, '短+短「剛好一樣長」')}`;
  }
  function setL(arr) {
    L = arr.slice(); e = 0; going = false; res = null;
    $$('input[data-k]', st).forEach((r, i) => { r.value = L[i]; $(`[data-v="${i}"]`, st).textContent = L[i]; });
    $('#ro', st).innerHTML = '按「倒下來圍圍看」！';
  }
  $$('input[data-k]', st).forEach(r => r.oninput = () => { L[+r.dataset.k] = +r.value; setL(L); });
  $$('[data-p]', st).forEach(b => b.onclick = () => { sfx('click'); setL(b.dataset.p.split(',').map(Number)); });
  $('#bGo', st).onclick = () => {

  function finish() {

    const head = `兩根短的：<b class="c-cyan">${a.v}</b> + <b class="c-pink">${b.v}</b> = <b>${sum}</b>　比一比　最長的：<b class="c-yellow">${c.v}</b>`;

    else { sfx('bad'); $('#ro', st).innerHTML = `${head}<br><b class="c-red">${sum} ＜ ${c.v}，倒下來也碰不到，還差 ${c.v - sum} 公分 ❌ 圍不起來</b>`; coach(`兩根短木棒加起來只有 ${sum} 公分，比 ${c.v} 公分短，就算整根躺平也碰不到對方！`); }
    seen[res] = true; task();
    if (seen.ok && seen.eq && seen.lt) complete(4, 'S', '三種情況都試過了！記住規則：<b>兩根短邊加起來，一定要「大於」最長邊</b>，才能圍成三角形。（課本說法：任意兩邊長的和大於第三邊）');
  }

  const stick = (xa, ya, xb, yb, col, label) => {
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke(); ctx.restore();
    if (label) txt(ctx, label, (xa + xb) / 2, (ya + yb) / 2, { size: 17, color: '#fff', stroke: '#06102a' });
  };
  loop((dt, t) => {

    const done = !going && e >= 1;
    if (done && res === 'ok') {
      ctx.save(); ctx.fillStyle = 'rgba(77,255,154,.16)'; ctx.beginPath(); ctx.moveTo(x0, BY); ctx.lineTo(p1.x, p1.y); ctx.lineTo(x1, BY); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    stick(x0, BY, x1, BY, c.col, null);
    txt(ctx, `${c.n} 最長的 ${c.v} 公分（放底下）`, 300, BY + 28, { size: 16, color: c.col });
    stick(x0, BY - lift, p1.x, p1.y, a.col, `${a.v}`);
    stick(x1, BY - lift, p2.x, p2.y, b.col, `${b.v}`);
    [[x0, BY], [x1, BY]].forEach(([x, y]) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill(); });
    if (done && res === 'ok') { star(ctx, p1.x, p1.y - 4, 12 + 2 * Math.sin(t * 6), '#4dff9a'); txt(ctx, '碰到了！是三角形', p1.x, Math.max(20, p1.y - 34), { size: 20, color: '#4dff9a', glow: '#4dff9a' }); }
    if (done && res === 'lt') {
      glowLine(ctx, p1.x, p1.y, p2.x, p2.y, '#ff4d6d', 4);
      txt(ctx, `還差 ${c.v - a.v - b.v} 公分，碰不到！`, (p1.x + p2.x) / 2, BY - 50, { size: 19, color: '#ff8aa0', glow: '#ff4d6d' });

      txt(ctx, '剛好碰到，但平平的 → 只是一條線', p1.x, BY - 52, { size: 18, color: '#ffd84a', glow: '#ffd84a' });
    }
    if (!res) txt(ctx, '兩根短木棒先直直站好，按按鈕讓它們倒向中間 ⬇', 300, 24, { size: 16, color: '#a7b6dc' });
    // 比長短條

/* =========================================================

function m4A(st) {

    `<div class="controls"><span class="lbl">選擇形狀：</span>${[4, 5, 6, 7, 8].map(k => `<button class="chip ${k === 5 ? 'on' : ''}" data-k="${k}">${['', '', '', '', '四', '五', '六', '七', '八'][k]}邊形</button>`).join('')}</div>
    <div class="cv-wrap"><canvas id="cv"></canvas></div>

  let n = 5, V = [], phase = 'idle', t = 0;
  function build() { V = []; for (let i = 0; i < n; i++) { const a = Math.PI / 2 + Math.PI / n + TAU * i / n; V.push({ x: CX + R * Math.cos(a), y: CY + R * Math.sin(a) }); } phase = 'idle'; t = 0; updRO(0); $('#bFire', st).disabled = false; }
  const nm = ['四', '五', '六', '七', '八'];
  function updRO(k) {

  }
  function fire() { if (phase !== 'idle') return; phase = 'fire'; t = 0; sfx('zap'); $('#bFire', st).disabled = true; $('#bFire', st).classList.remove('glow'); }

  cv.addEventListener('pointerdown', e => { const p = C.pt(e); if (Math.hypot(p.x - V[0].x, p.y - V[0].y) < 45) fire(); });
  build();
  let lastK = -1;
  loop((dt, tm) => {

    // 對角線雷射

  });

/* =========================================================
   單元 4B：撕角拼圖大轉盤

function m4B(st) {
  st.innerHTML = modeHead('🔺 第 2 關：撕角拼圖（三角形內角和）', '問題：<b>三角形的三個角加起來是幾度？</b>按「把角撕下來」，三個角會飛到下面的直線上拼在一起。先玩三角形，再試試四邊形！') +
    `<div class="controls"><button class="chip on" data-s="0">🔺 三角形</button><button class="chip" data-s="1">⬜ 四邊形</button></div>
    <div class="cv-wrap"><canvas id="cv"></canvas></div>
    <div class="controls"><button class="btn pink glow" id="bTear">✋ 把角撕下來</button><button class="btn ghost sm" id="bR">↺ 貼回去</button></div>
    <div class="readout" id="ro"></div>`;
  const C = setupCanvas($('#cv', st), 600, 520, 600), ctx = C.ctx;
  const shapes = [[[110, 250], [250, 60], [480, 250]], [[90, 250], [160, 70], [430, 90], [510, 250]]];
  const cols = ['#ff5ad9', '#3ef0ff', '#ffd84a', '#4dff9a'];
  const norm = a => { a %= TAU; return a < 0 ? a + TAU : a; };
  const TC = { x: 300, y: 430 }, WR = 50;
  let si = 0, W = [], phase = 'idle', t = 0, doneSet = new Set();
  function build() {
    const pts = shapes[si], n = pts.length; W = [];
    for (let i = 0; i < n; i++) {
      const v = pts[i], p = pts[(i + n - 1) % n], q = pts[(i + 1) % n];
      const dP = Math.atan2(p[1] - v[1], p[0] - v[0]), dN = Math.atan2(q[1] - v[1], q[0] - v[0]);
      let sw = norm(dN - dP), s = dP; if (sw > Math.PI) { s = dN; sw = TAU - sw; }
      W.push({ x: v[0], y: v[1], s, sw, deg: Math.round(sw * 180 / Math.PI) });
    }
    const total = n === 3 ? 180 : 360; W[n - 1].deg = total - W.slice(0, n - 1).reduce((a, w) => a + w.deg, 0);
    let cum = Math.PI; W.forEach(w => { w.ts = cum; cum += w.sw; });
    phase = 'idle'; t = 0; $('#bTear', st).disabled = false; $('#bTear', st).classList.add('glow');
    $('#ro', st).innerHTML = `${n === 3 ? '三角形' : '四邊形'}的內角：${W.map((w, i) => `<span style="color:${cols[i]}">${w.deg}°</span>`).join('、')}，合起來是多少？`;
  }
  $$('[data-s]', st).forEach(b => b.onclick = () => { $$('[data-s]', st).forEach(x => x.classList.remove('on')); b.classList.add('on'); si = +b.dataset.s; sfx('click'); build(); });
  $('#bTear', st).onclick = () => { if (phase !== 'idle') return; phase = 'tear'; t = 0; sfx('click'); $('#bTear', st).disabled = true; $('#bTear', st).classList.remove('glow'); };
  $('#bR', st).onclick = () => { sfx('click'); build(); };
  build();

    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, WR, s, s + sw); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle = 'rgba(6,16,42,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, WR, s, s + sw); ctx.closePath(); ctx.stroke();

  }

      const e = phase === 'idle' ? 0 : ease((t - i * 0.45) / 1.0);
      if (e < 1) allIn = false;
      if (e > 0) { ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = cols[i]; ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.arc(w.x, w.y, WR, w.s, w.s + w.sw); ctx.closePath(); ctx.stroke(); ctx.restore(); }

      else coach(n === 3 ? '哇！三個角剛好拼成一條直線，三角形內角和 = <b class="c-green">180°</b>！再按上面的「四邊形」試試看。' : '四個角拼成一整個圓，四邊形內角和 = <b class="c-green">360°</b>！也試試三角形吧。');

  });

/* =========================================================
   直式除法排版器
   ========================================================= */
function makeLD(el, cols, rows, divisor) {
  const cw = 40, ch = 44, ox = 66, oy = 6;
  el.className = 'ld'; el.innerHTML = '';
  el.style.width = (ox + cols * cw + 16) + 'px'; el.style.height = (oy + rows * ch + 10) + 'px';
  return {
    cw, ch, ox, oy,
    cell(r, c, t, cls = '') { const d = document.createElement('div'); d.className = 'ldc ' + cls; d.style.left = (ox + c * cw) + 'px'; d.style.top = (oy + r * ch) + 'px'; d.textContent = t; el.appendChild(d); return d; },
    line(r, c0, c1) { const d = document.createElement('div'); d.className = 'ldl'; d.style.left = (ox + c0 * cw - 4) + 'px'; d.style.top = (oy + r * ch - 2) + 'px'; d.style.width = ((c1 - c0 + 1) * cw + 8) + 'px'; el.appendChild(d); return d; },
    bracket(r, n) {
      const d = document.createElement('div'); d.className = 'ldb'; d.style.left = (ox - 12) + 'px'; d.style.top = (oy + r * ch - 2) + 'px'; d.style.width = (n * cw + 20) + 'px'; d.style.height = (ch + 2) + 'px'; el.appendChild(d);
      const v = document.createElement('div'); v.className = 'ldc divisor'; v.style.left = (ox - 56) + 'px'; v.style.top = (oy + r * ch) + 'px'; v.textContent = divisor; el.appendChild(v);
    }
  };
}

/* =========================================================
   Three.js 星際背景（載入失敗時自動略過）
   ========================================================= */
function initStars() {
  if (!window.THREE) return;
  try {
    const cv = $('#stars');
    const R = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: false });
    R.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(60, 1, 1, 2000); cam.position.z = 600;
    const N = 1400, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const pal = [[0.24, 0.94, 1], [1, 0.35, 0.85], [1, 0.85, 0.3], [0.8, 0.85, 1]];
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 1800; pos[i * 3 + 1] = (Math.random() - 0.5) * 1400; pos[i * 3 + 2] = (Math.random() - 0.5) * 1400;
      const c = pal[i % 4]; col.set(c, i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 3, vertexColors: true, transparent: true, opacity: 0.85 }));
    scene.add(pts);
    const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(120, 1), new THREE.MeshBasicMaterial({ color: 0x3ef0ff, wireframe: true, transparent: true, opacity: 0.18 }));
    planet.position.set(520, 260, -300); scene.add(planet);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(200, 2, 8, 80), new THREE.MeshBasicMaterial({ color: 0xff5ad9, transparent: true, opacity: 0.3 }));
    ring.position.copy(planet.position); ring.rotation.x = 1.2; scene.add(ring);
    function size() { R.setSize(window.innerWidth, window.innerHeight, false); cam.aspect = window.innerWidth / window.innerHeight; cam.updateProjectionMatrix(); }
    size(); window.addEventListener('resize', size);
    (function anim() { pts.rotation.y += 0.0004; pts.rotation.x += 0.0001; planet.rotation.y += 0.003; planet.rotation.x += 0.001; ring.rotation.z += 0.002; R.render(scene, cam); requestAnimationFrame(anim); })();
  } catch (e) { /* WebGL 不支援時略過 */ }
}
(function loadThree() {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload = initStars; document.head.appendChild(s);
})();
