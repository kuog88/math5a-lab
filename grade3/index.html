<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>三年級數學樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff6e5;--bg2:#e2f3ff;--ink:#4a3b5c;--muted:#8a7a99;--card:#ffffff;
  --pink:#ff7eb3;--blue:#5bb4ff;--mint:#3fcf9c;--yellow:#ffc93c;--orange:#ff9a4d;--purple:#a98bff;--red:#ff6b6b;
  --line:#efe3f5;--shadow:0 6px 0 rgba(74,59,92,.13);--r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);overflow-x:hidden;font-family:"Fredoka","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  background:linear-gradient(180deg,var(--bg2) 0%,#f3f9ff 35%,var(--bg1) 100%);background-attachment:fixed}
button{font-family:inherit;touch-action:manipulation;color:var(--ink)}
canvas{touch-action:none;display:block}
[hidden]{display:none!important}
/* 背景裝飾：雲朵與小圓點 */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-60%}
.cloud::after{width:40%;height:120%;right:12%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.dot{position:absolute;border-radius:50%;opacity:.35;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-18px)}}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:76px 16px 48px}

.home-btn{position:fixed;top:12px;left:12px;z-index:60;border:3px solid var(--blue);background:#fff;font-size:16px;font-weight:900;padding:9px 16px;border-radius:999px;cursor:pointer;box-shadow:0 4px 0 #3b8fd6}
.home-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b8fd6}
.sound-btn{position:fixed;top:12px;right:12px;z-index:60;width:48px;height:48px;border-radius:50%;border:3px solid var(--purple);background:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #7f63d9}

/* 首頁 */
.hero{text-align:center;margin:4px 0 18px}
.hero h1{margin:0;font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:2px;line-height:1.2;color:var(--ink)}
.hero h1 .rb{display:inline-block;animation:wiggle 2.4s ease-in-out infinite}
.hero h1 .rb:nth-child(2n){animation-delay:.3s}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
.hero p{color:var(--muted);margin:8px 0 0;font-size:16px;font-weight:700}
.total{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:8px 18px;border-radius:999px;background:#fff;border:3px solid var(--yellow);font-weight:900;box-shadow:var(--shadow)}
.total b{color:var(--orange);font-size:22px}
.grade-link{display:inline-block;margin-top:12px;margin-left:8px;padding:8px 16px;border-radius:999px;background:#fff;border:3px solid var(--mint);color:var(--ink);font-weight:900;text-decoration:none;box-shadow:0 4px 0 #26a37a}
.reset-link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.sem-switch{display:flex;justify-content:center;gap:12px;margin:16px 0}
.sem{border:3px solid var(--line);background:#fff;border-radius:999px;padding:10px 26px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:var(--shadow)}
.sem.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 6px 0 #d9568f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ucard{position:relative;text-align:left;cursor:pointer;border-radius:28px;padding:18px 18px 14px;background:#fff;border:4px solid var(--c);box-shadow:0 8px 0 var(--c);transition:transform .15s}
.ucard:hover{transform:translateY(-4px) rotate(-.5deg)}
.ucard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--c)}
.ucard.locked{filter:grayscale(.7);opacity:.75;cursor:default}
.ucard.locked:hover{transform:none}
.u-no{display:inline-block;font-size:14px;font-weight:900;padding:3px 12px;border-radius:999px;background:var(--c);color:#fff}
.u-icon{position:absolute;right:16px;top:10px;font-size:44px;animation:bob 3s ease-in-out infinite}
.ucard h3{margin:10px 0 10px;font-size:24px;font-weight:900}
.u-modes{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:700}
.u-modes div{display:flex;align-items:center;gap:8px;background:#faf6ff;border-radius:12px;padding:6px 10px}
.star{font-size:20px;color:#e6dcef;line-height:1}
.star.on{color:var(--yellow);text-shadow:0 2px 0 #e0a800}
.u-stars{margin-top:8px;font-size:26px;letter-spacing:4px}
.lock-tag{display:inline-block;margin-top:6px;font-size:14px;font-weight:900;color:var(--orange)}

/* 老師對話框 */
.coach{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.coach-face{flex:0 0 78px;width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid var(--orange);box-shadow:var(--shadow);overflow:hidden;animation:bob 3s ease-in-out infinite}
.coach-face svg{width:100%;height:100%}
.coach-bubble{position:relative;flex:1;background:#fff;border:3px solid var(--orange);border-radius:22px;padding:12px 52px 12px 16px;font-size:17px;line-height:1.7;min-height:62px;box-shadow:var(--shadow);font-weight:500}
.coach-bubble::before{content:"";position:absolute;left:-14px;top:24px;border:11px solid transparent;border-right-color:var(--orange);border-left:0}
.coach-bubble .who{display:block;font-size:13px;color:var(--orange);font-weight:900}
.coach-bubble.pulse{animation:pop .35s}
.speak{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff7ef;cursor:pointer;font-size:18px}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}

/* 單元頁 */
.unit-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.unit-head h2{margin:0;font-size:clamp(24px,4.5vw,34px);font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{position:relative;border:3px solid var(--line);background:#fff;border-radius:20px;padding:10px 6px;font-size:16px;font-weight:900;cursor:pointer;min-height:60px;line-height:1.3;box-shadow:var(--shadow)}
.tab small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 0 #3b8fd6}
.tab.on small{color:#eaf6ff}
.tab .ok{position:absolute;top:-10px;right:-6px;background:var(--yellow);color:#fff;border-radius:50%;width:28px;height:28px;font-size:16px;display:grid;place-items:center;box-shadow:0 3px 0 #e0a800}
.stage{background:#fff;border:3px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.mode-title{font-size:22px;font-weight:900;margin-bottom:6px}
.question{font-size:clamp(19px,3.8vw,24px);font-weight:900;text-align:center;padding:12px 14px;margin:4px 0 10px;border-radius:20px;background:#fff8e6;border:3px dashed var(--yellow);line-height:1.6}
.cv-wrap{width:100%;display:flex;justify-content:center;margin:8px 0;border-radius:22px;background:#fbfdff;border:3px solid #e6f1fb;
  background-image:linear-gradient(#eef6fd 1px,transparent 1px),linear-gradient(90deg,#eef6fd 1px,transparent 1px);background-size:24px 24px}
.cv-wrap canvas{border-radius:20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0}
.lbl{font-weight:900;color:var(--muted)}
.btn{border:none;border-radius:20px;padding:13px 22px;min-height:54px;font-size:18px;font-weight:900;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 #3b8fd6;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3b8fd6}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #d9568f}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #26a37a}
.btn.yellow{background:var(--yellow);box-shadow:0 5px 0 #d9a300;color:#5a4300}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 #d9732b}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 #7f63d9}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 #e3d6ec}
.btn.sm{padding:9px 14px;font-size:16px;min-height:46px}
.btn:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed;transform:none}
.btn.glow{animation:btnBounce 1.1s infinite}
@keyframes btnBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.chip{border:3px solid var(--line);background:#fff;padding:8px 16px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--pink);background:#ffe9f2;color:#d9568f}
.readout{text-align:center;font-size:20px;font-weight:700;line-height:1.7;padding:10px 14px;border-radius:18px;background:#f6f2ff;min-height:52px}
.readout small{display:block;font-size:15px;color:var(--muted)}
.task-bar{background:#fff1f7;border:3px dashed var(--pink);border-radius:18px;padding:10px 14px;font-weight:900;text-align:center;line-height:1.7}
.big{font-size:1.4em}
.c-blue{color:#2f8de0}.c-pink{color:#e5508f}.c-mint{color:#1fa979}.c-yellow{color:#d69a00}.c-orange{color:#e8731f}.c-purple{color:#7b5ce0}.c-red{color:#e54848}
.tip{margin-top:16px;padding:14px 18px;border-radius:22px;background:#fffbe9;border:3px solid var(--yellow);line-height:1.7;font-size:17px;font-weight:500}
.tip b{color:#d69a00;display:block;font-size:16px}
.nav-next{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.guide{display:grid;gap:6px;margin:6px 0 10px}
.gstep{padding:9px 14px;border-radius:16px;background:#faf7fd;border:3px solid var(--line);opacity:.6;font-size:16px;line-height:1.6;font-weight:700}
.gstep .gn{color:var(--orange);font-weight:900;margin-right:6px}
.gstep.now{opacity:1;border-color:var(--yellow);background:#fff8e1}
.gstep.done{opacity:.9;border-color:#bdeedb;background:#effcf6}
.gstep.done .gn::before{content:"✅ "}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.panel{background:#fbf8ff;border:3px solid var(--line);border-radius:22px;padding:12px;min-height:120px}
.panel-title{font-weight:900;text-align:center;margin-bottom:8px;color:var(--purple)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:900}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:3px solid currentColor}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:popIn .35s both}
.shake{animation:shake .4s}
.boom{animation:boom .4s forwards}
@keyframes boom{to{transform:scale(2);opacity:0}}

/* 直式格子 */
.vg{position:relative;margin:0 auto;font-weight:700}
.vc{position:absolute;width:46px;height:50px;display:grid;place-items:center;font-size:32px;animation:popIn .3s both;z-index:2}
.vc.small{font-size:18px;color:var(--pink);font-weight:900;height:30px;margin-top:20px}
.vc.res{color:#1fa979}
.vc.hl{background:#fff3b8;border-radius:12px}
.vc.cross{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px;color:#b8a9c6}
.vc.op{color:var(--purple)}
.vl{position:absolute;height:4px;background:var(--ink);border-radius:2px}
.vb{position:absolute;border-top:4px solid var(--ink);border-left:4px solid var(--ink);border-top-left-radius:18px}
.vbox{display:flex;justify-content:center;overflow-x:auto;padding:8px 0}

/* 積木 & 錢幣 */
.pv-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pv-col{min-width:0;background:#fff;border:3px solid var(--c);border-radius:18px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pv-name{font-weight:900;color:#fff;background:var(--c);border-radius:999px;padding:2px 12px;font-size:15px}
.pv-pile{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-end;min-height:118px;width:100%}
.pv-digit{font-size:32px;font-weight:700}
.pv-btns{display:flex;gap:6px}
.pv-btns button{width:44px;height:44px;border-radius:50%;border:3px solid var(--c);background:#fff;font-size:22px;font-weight:900;cursor:pointer}
.b1000{width:42px;height:42px;border-radius:6px;background:linear-gradient(135deg,#9ad6ff,#5bb4ff);box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),0 2px 0 #2f7fc4}
.b100{width:34px;height:34px;border-radius:4px;background:#ff9cc4;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:3.4px 3.4px;box-shadow:0 2px 0 #d9568f}
.b10{width:9px;height:40px;border-radius:3px;background:#ffd45c;background-image:linear-gradient(rgba(0,0,0,.15) 1px,transparent 1px);background-size:9px 4px;box-shadow:0 2px 0 #d9a300}
.b1{width:12px;height:12px;border-radius:3px;background:#6fe0b5;box-shadow:0 2px 0 #26a37a}
.money{display:grid;place-items:center;font-weight:900;flex:0 0 auto;cursor:pointer}
.m1000{width:62px;height:32px;border-radius:6px;background:linear-gradient(90deg,#8fd6c2,#5cc2a5);color:#fff;font-size:13px;border:2px solid #3ca78a}
.m100{width:56px;height:30px;border-radius:6px;background:linear-gradient(90deg,#ff9e9e,#ff6b6b);color:#fff;font-size:13px;border:2px solid #e04b4b}
.m10{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c2,#ffcc33 55%,#d9a300);color:#6b4b00;font-size:12px}
.m1{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3c8,#e6a36a 55%,#b0703a);color:#5a2e00;font-size:11px}
.tray{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:flex-start;min-height:90px;padding:10px;border-radius:18px;background:#fffdf4;border:3px dashed var(--yellow)}
.flyer{position:fixed;z-index:90;pointer-events:none;transition:transform .7s cubic-bezier(.4,1.4,.5,1),opacity .3s}
.rocket{font-size:26px;font-weight:900;color:var(--pink);background:#fff;border:3px solid var(--pink);border-radius:999px;padding:0 8px}

/* 鷹架 */
.problem{text-align:center;font-size:clamp(24px,5vw,36px);font-weight:900;margin:6px 0 12px}
.visual{display:flex;justify-content:center;margin-bottom:12px}
.steps{display:grid;gap:14px}
.step{border-radius:22px;padding:14px 16px;background:#faf7fd;border:3px solid var(--line);animation:popIn .35s both}
.step.solved{border-color:#bdeedb;background:#effcf6}
.step-no{display:inline-block;font-size:14px;font-weight:900;padding:3px 12px;border-radius:999px;background:var(--purple);color:#fff;margin-bottom:6px}
.step.solved .step-no{background:var(--mint)}
.step-q{font-size:19px;font-weight:700;line-height:1.7}
.blank{display:inline-block;min-width:54px;padding:0 8px;margin:0 3px;border-bottom:4px solid var(--yellow);color:#d69a00;text-align:center;font-weight:900}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.opt{min-width:84px;min-height:54px;padding:10px 18px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #e3d6ec}
.opt.sel{border-color:var(--yellow);background:#fff8e1}
.opt.right{border-color:var(--mint);background:#e3fbf1;color:#1fa979}
.opt.wrong{border-color:var(--red);background:#ffecec;animation:shake .4s}
.opt:disabled{cursor:default}
.ok-msg{margin-top:8px;color:#1fa979;font-weight:900;font-size:16px}
.final-card{text-align:center;padding:18px;border-radius:22px;background:#fff8e1;border:4px solid var(--yellow);font-size:20px;font-weight:900;animation:popIn .4s both}

.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-20px);z-index:95;padding:14px 26px;border-radius:999px;font-size:20px;font-weight:900;color:#fff;background:var(--pink);box-shadow:0 6px 0 #d9568f;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-20px;z-index:94;pointer-events:none;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

@media (max-width:720px){
  #app{padding:72px 12px 40px}
  .stage{padding:14px 10px;border-radius:22px}
  .tab{font-size:14px;padding:8px 4px}
  .tab small{font-size:11px}
  .coach-face{flex-basis:58px;width:58px;height:58px}
  .coach-bubble{font-size:16px;padding:10px 46px 10px 12px}
  .two-col{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .btn{font-size:17px;padding:12px 16px}
  .readout{font-size:18px}
  .home-btn{font-size:14px;padding:8px 12px}
  .pv-cols{gap:5px}
  .pv-btns{gap:3px}
  .pv-btns button{width:32px;height:32px;font-size:18px}
  .b1000{width:30px;height:30px}.b100{width:26px;height:26px}
  .m1000{width:52px}.m100{width:48px}
}
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<button class="home-btn" id="homeBtn">🏠 返回首頁選單</button>
<button class="sound-btn" id="soundBtn" title="音效開關">🔊</button>
<div class="toast" id="toast"></div>

<div id="app">
  <section id="hub">
    <header class="hero">
      <h1><span class="rb">🌈</span> 三年級<span class="rb">數</span><span class="rb">學</span><span class="rb">樂</span><span class="rb">園</span></h1>
      <p>康軒三年級 ‧ 每單元 3 關：動手玩 🎮、想規則 🧩、挑戰題 🎯</p>
      <div class="total">⭐ 已收集 <b id="totalStars">0</b> / <span id="totalMax">27</span> 顆星 <button class="reset-link" id="resetBtn">重置進度</button></div>
      <a class="grade-link" href="../">🎒 換年級</a>
    </header>
    <div class="sem-switch"><button class="sem on" data-sem="up">📘 三上</button><button class="sem" data-sem="down">📗 三下</button></div>
    <div class="coach">
      <div class="coach-face" data-face></div>
      <div class="coach-bubble"><span class="who">石虎老師</span><span id="hubText">嗨！我是石虎老師 🐾 每個單元都有 3 顆星星，點一張卡片開始玩吧！</span></div>
    </div>
    <div class="grid" id="cards"></div>
  </section>

  <section id="unit" hidden>
    <div class="unit-head"><span class="u-no" id="unitNo">單元 1</span><h2 id="unitTitle"></h2></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="coach">
      <div class="coach-face" data-face></div>
      <div class="coach-bubble" id="coachBox"><span class="who">石虎老師</span><span id="coachText"></span><button class="speak" id="speakBtn" title="唸給我聽">🔈</button></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="tip" id="tip"></div>
    <div class="nav-next" id="navNext"></div>
  </section>
</div>

<script>
/* =========================================================
   共用工具
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const F = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const FONT = '"Fredoka","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
const TAU = Math.PI * 2;
const INK = '#4a3b5c';

let cleanups = [];
function onCleanup(fn) { cleanups.push(fn); }
function runCleanup() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; try { speechSynthesis.cancel(); } catch (e) {} }
function later(fn, ms) { const id = setTimeout(fn, ms); onCleanup(() => clearTimeout(id)); return id; }
function loop(fn) {
  let id, last = performance.now();
  const f = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; fn(dt, now / 1000); id = requestAnimationFrame(f); };
  id = requestAnimationFrame(f);
  onCleanup(() => cancelAnimationFrame(id));
}
function setupCanvas(cv, W, H, maxW) {
  const ctx = cv.getContext('2d');
  const C = { W, H, ctx, s: 1, dw: 0 };
  function resize() {
    const pw = cv.parentElement.clientWidth; if (!pw) return;
    const dw = Math.min(pw, maxW || W); if (dw === C.dw) return; C.dw = dw;
    const s = dw / W, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = dw + 'px'; cv.style.height = (H * s) + 'px';
    cv.width = Math.round(dw * dpr); cv.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0); C.s = s;
  }
  resize();
  const ro = new ResizeObserver(resize); ro.observe(cv.parentElement); onCleanup(() => ro.disconnect());
  C.pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  C.clear = () => ctx.clearRect(0, 0, W, H);
  return C;
}
function txt(ctx, t, x, y, o = {}) {
  const { size = 20, color = INK, align = 'center', weight = 700, stroke = null } = o;
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = 6; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fracC(ctx, n, d, x, y, size, color = INK) {
  txt(ctx, String(n), x, y - size * 0.62, { size, color, stroke: '#fff' });
  ctx.fillStyle = color; ctx.fillRect(x - size * 0.6, y - 2, size * 1.2, 4);
  txt(ctx, String(d), x, y + size * 0.62, { size, color, stroke: '#fff' });
}
function cuteStar(ctx, x, y, r, color) {
  ctx.save(); ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
}
/* 把元素從 A 飛到 B（用畫面座標） */
function flyBetween(fromEl, toEl, html, cls = 'rocket', ms = 750) {
  return new Promise(res => {
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'flyer ' + cls; f.innerHTML = html;
    f.style.left = (a.left + a.width / 2) + 'px'; f.style.top = (a.top + a.height / 2) + 'px';
    document.body.appendChild(f);
    const fr = f.getBoundingClientRect();
    f.style.left = (a.left + a.width / 2 - fr.width / 2) + 'px'; f.style.top = (a.top + a.height / 2 - fr.height / 2) + 'px';
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px,${b.top + b.height / 2 - a.top - a.height / 2}px) scale(1.1)`; }));
    setTimeout(() => { f.remove(); res(); }, ms + 50);
  });
}

function makeGrid(el, cols, rows, opt = {}) {
  const cw = opt.cw || 46, ch = opt.ch || 50, ox = opt.ox || 10, oy = opt.oy || 30;
  el.className = 'vg'; el.innerHTML = '';
  el.style.width = (ox + cols * cw + 14) + 'px'; el.style.height = (oy + rows * ch + 10) + 'px';
  const cells = {};
  return {
    cw, ch, ox, oy, el,
    cell(r, c, t, cls = '') {
      const k = r + ',' + c; if (cells[k]) cells[k].remove();
      const d = document.createElement('div'); d.className = 'vc ' + cls; d.textContent = t;
      d.style.left = (ox + c * cw) + 'px'; d.style.top = (r < 0 ? oy - 30 : oy + r * ch) + 'px';
      el.appendChild(d); cells[k] = d; return d;
    },
    get(r, c) { return cells[r + ',' + c]; },
    line(r, c0, c1) { const d = document.createElement('div'); d.className = 'vl'; d.style.left = (ox + c0 * cw - 4) + 'px'; d.style.top = (oy + r * ch - 3) + 'px'; d.style.width = ((c1 - c0 + 1) * cw + 8) + 'px'; el.appendChild(d); return d; },
    bracket(r, c0, n, divisor) {
      const d = document.createElement('div'); d.className = 'vb'; d.style.left = (ox + c0 * cw - 12) + 'px'; d.style.top = (oy + r * ch - 3) + 'px'; d.style.width = (n * cw + 20) + 'px'; d.style.height = (ch + 2) + 'px'; el.appendChild(d);
      this.cell(r, c0 - 1, divisor, 'op');
    }
  };
}

let AC = null, soundOn = true;
function sfx(type) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const map = { ok: [660, 990, 'triangle'], bad: [300, 200, 'sine'], click: [600, 760, 'sine'], win: [523, 1318, 'triangle'], pop: [880, 1200, 'sine'], boing: [220, 520, 'triangle'] };
    const [a, b, w] = map[type] || map.click;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = w; o.frequency.setValueAtTime(a, t); o.frequency.exponentialRampToValueAtTime(b, t + 0.2);
    g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.3);
  } catch (e) {}
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\s+/g, ' '));
    u.lang = 'zh-TW'; u.rate = 0.95; u.pitch = 1.15;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast('這台裝置不支援朗讀'); }
}

function numZh(n) {
  if (n === 10000) return '一萬'; if (n === 0) return '零';
  const d = '零一二三四五六七八九', u = ['千', '百', '十', ''], s = String(n).padStart(4, '0');
